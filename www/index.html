<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>پنل مدیریت</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- صفحه اتصال به سرور -->
  <div id="screen-connect" class="screen center-screen">
    <h1 id="brandTitle">پنل مدیریت</h1>
    <p class="note" style="max-width:300px">برای اولین بار، کد اتصال سیستم را که از پنل تنظیمات وب‌سایت گرفته‌اید وارد کنید.</p>
    <div style="width:100%;max-width:300px">
      <textarea id="connectionCodeInput" rows="3" placeholder="کد اتصال را اینجا جای‌گذاری کنید…"></textarea>
      <div id="connectError" class="note" style="color:var(--danger)"></div>
      <button class="btn block" style="margin-top:10px" onclick="Admin.saveConnection()">اتصال</button>
    </div>
  </div>

  <!-- صفحه ورود -->
  <div id="screen-login" class="screen center-screen hidden">
    <h1 id="loginBrand">پنل مدیریت</h1>
    <p class="note">ورود مخصوص مدیران سیستم</p>
    <div style="width:100%;max-width:300px;text-align:right">
      <label>کد پرسنلی</label>
      <input type="text" id="loginPersonnel">
      <label>کد ملی</label>
      <input type="password" id="loginNational">
      <div id="loginError" class="note" style="color:var(--danger)"></div>
      <button class="btn block" style="margin-top:12px" onclick="Admin.login()">ورود</button>
      <button class="btn secondary block" style="margin-top:8px" onclick="Admin.resetConnection()">تغییر سرور متصل</button>
    </div>
  </div>

  <!-- برنامه اصلی -->
  <div id="screen-main" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <div class="topbar">
      <span id="mainBrand" style="font-weight:800;font-size:14px"></span>
      <div style="display:flex;gap:10px;align-items:center">
        <button onclick="Admin.toggleTheme()" class="btn secondary" style="padding:6px 10px;font-size:11px;border-color:rgba(244,239,228,.3);color:var(--paper)">🌓</button>
        <button onclick="Admin.logout()" class="btn secondary" style="padding:6px 10px;font-size:11px;border-color:rgba(244,239,228,.3);color:var(--paper)">خروج</button>
      </div>
    </div>
    <div class="tabbar">
      <button data-tab="categories" onclick="Admin.showTab('categories')" class="active">دسته‌بندی‌ها</button>
      <button data-tab="topics" onclick="Admin.showTab('topics')">مطالب</button>
      <button data-tab="users" onclick="Admin.showTab('users')">کاربران</button>
      <button data-tab="settings" onclick="Admin.showTab('settings')">تنظیمات</button>
    </div>
    <div class="screen" id="tabContent"></div>
  </div>

  <div id="loading" class="screen center-screen hidden">
    <div class="spinner"></div>
    <div class="note" id="loadingText">در حال بارگذاری…</div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
